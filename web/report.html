<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>molfar_audit report</title>
<style>
:root{--bg:#141517;--panel:#1d1f23;--line:#2c2f36;--text:#e6e6e6;--muted:#9aa0aa;--critical:#ef4444;--warning:#f59e0b;--possible:#38bdf8;--info:#a1a1aa;--accent:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main,footer{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-transform:capitalize}
.card b{display:block;font-size:24px}
.card.critical b{color:var(--critical)}.card.warning b{color:var(--warning)}.card.possible b{color:var(--possible)}.card.info b{color:var(--info)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
input{flex:1;min-width:160px}
button{cursor:pointer}button:hover,select:hover{border-color:var(--accent)}
.finding{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;padding:12px;margin-bottom:8px}
.finding.critical{border-left-color:var(--critical)}.finding.warning{border-left-color:var(--warning)}.finding.possible{border-left-color:var(--possible)}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--line)}
.critical .badge{color:var(--critical)}.warning .badge{color:var(--warning)}.possible .badge{color:var(--possible)}
.where{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;margin-top:4px}
.why,.fix{margin:6px 0 0;color:var(--muted)}
.fix::before{content:"Fix: ";color:var(--text);font-weight:600}
details{margin-top:6px}
details ul{margin:6px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:32px}
footer{color:var(--muted);font-size:12px;text-align:center}
footer a{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>molfar_audit report</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="cards" id="summary"></div>
</header>
<main>
  <div class="toolbar">
    <select id="severity" aria-label="Level"><option value="">All levels</option><option value="critical">Critical</option><option value="warning">Warning</option><option value="possible">Possible</option><option value="info">Info</option></select>
    <select id="group" aria-label="Group"><option value="">All groups</option><option value="manifest">Manifest</option><option value="items">Items</option><option value="config">Config</option><option value="lua">Lua</option></select>
    <select id="resource" aria-label="Resource"><option value="">All resources</option></select>
    <input id="search" type="search" placeholder="Search…" aria-label="Search">
    <button id="copy" type="button">Copy for forum</button>
    <button id="download" type="button">Download JSON</button>
  </div>
  <div id="findings"></div>
  <div class="empty" id="empty" hidden></div>
</main>
<footer>Generated by molfar_audit · <a href="https://molfarlabs.com" target="_blank" rel="noopener noreferrer">Molfar Labs · molfarlabs.com</a></footer>
<script>
(function () {
  'use strict';
  var LEVELS = ['critical', 'warning', 'possible', 'info'];
  var report = null;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }

  var token = new URLSearchParams(location.search).get('t') || '';
  var base = location.pathname.replace(/\/?$/, '/');
  fetch(base + 'report.json?t=' + encodeURIComponent(token))
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) { $('meta').textContent = 'Could not load the report (' + e.message + '). The link may have expired — run the audit again.'; });

  function render(data) {
    report = data;
    var s = data.summary;
    $('meta').textContent = 'Generated ' + new Date(data.generatedAt).toLocaleString() + ' · ' + s.resources + ' resources · ' + s.luaFiles + ' Lua files · ' +
      (s.durationMs / 1000).toFixed(1) + ' s · v' + data.version + (s.hidden ? ' · ' + s.hidden + ' hidden by ignores' : '');
    LEVELS.forEach(function (l) {
      var c = el('div', 'card ' + l);
      c.appendChild(el('b', null, s.bySeverity[l] || 0));
      c.appendChild(el('span', null, l));
      $('summary').appendChild(c);
    });
    var names = {};
    data.findings.forEach(function (f) { if (f.resource) names[f.resource] = true; });
    Object.keys(names).sort().forEach(function (n) { var o = el('option', null, n); o.value = n; $('resource').appendChild(o); });
    var list = $('findings');
    data.findings.forEach(function (f, i) { list.appendChild(card(f, i)); });
    ['severity', 'group', 'resource'].forEach(function (id) { $(id).addEventListener('change', applyFilters); });
    $('search').addEventListener('input', applyFilters);
    $('empty').textContent = data.findings.length ? 'No findings match the filters.' : 'No problems found.';
    applyFilters();
  }

  function card(f, i) {
    var c = el('article', 'finding ' + f.severity);
    c.dataset.index = String(i);
    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', f.severity));
    head.appendChild(el('strong', null, f.rule));
    head.appendChild(el('span', null, f.message));
    c.appendChild(head);
    var where = [f.resource, f.file].filter(Boolean).join('/') + (f.line ? ':' + f.line : '');
    if (where) c.appendChild(el('div', 'where', where));
    c.appendChild(el('p', 'why', f.why));
    c.appendChild(el('p', 'fix', f.fix));
    if (f.details && f.details.length) {
      var d = el('details');
      d.appendChild(el('summary', null, f.details.length + ' items'));
      var ul = el('ul');
      f.details.forEach(function (x) { ul.appendChild(el('li', null, x)); });
      d.appendChild(ul);
      c.appendChild(d);
    }
    c.dataset.search = [f.rule, f.message, f.resource, f.file, f.why, f.fix].concat(f.details || []).join(' ').toLowerCase();
    return c;
  }

  function applyFilters() {
    var sev = $('severity').value, grp = $('group').value, res = $('resource').value, q = $('search').value.trim().toLowerCase(), shown = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.finding'), function (c) {
      var f = report.findings[Number(c.dataset.index)];
      var ok = (!sev || f.severity === sev) && (!grp || f.group === grp) && (!res || f.resource === res) && (!q || c.dataset.search.indexOf(q) !== -1);
      c.hidden = !ok;
      if (ok) shown++;
    });
    $('empty').hidden = shown !== 0;
  }

  $('copy').addEventListener('click', function () {
    if (!report || !navigator.clipboard) return;
    var btn = $('copy');
    navigator.clipboard.writeText(report.markdown).then(function () {
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = 'Copy for forum'; }, 1500);
    });
  });

  $('download').addEventListener('click', function () {
    if (!report) return;
    var a = el('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
    a.download = 'molfar_audit-' + report.generatedAt.slice(0, 19).replace(/[:T]/g, '-') + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 0);
  });
})();
</script>
</body>
</html>
